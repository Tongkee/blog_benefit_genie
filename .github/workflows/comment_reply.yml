name: 댓글 스티커 자동응답

on:
  # 하루 3회 — 아침/점심/저녁 발행 후 댓글이 쌓일 시간대(KST 10:30, 15:30, 21:30)
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "등록 직전까지만 (셀렉터 진단, true/false)"
        required: false
        default: "false"

concurrency:
  group: naver-comment-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    # 2026-07-30 실사고: 네이버 에디터 무응답으로 4~5시간 행 → 기본 360분 소진 후 취소.
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install chromium --with-deps

      - name: 랜덤 딜레이 (봇 패턴 방지)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 600))
          echo "랜덤 딜레이: ${DELAY}초"
          sleep $DELAY

      - name: 댓글 스티커 응답 실행
        env:
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
          NAVER_COOKIES: ${{ secrets.NAVER_COOKIES }}
          DRY_RUN:       ${{ github.event.inputs.dry_run || 'false' }}
        run: python -m scripts.naver_comment_reply

      - name: 응답 이력 커밋
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/comment_reply_history.json; do git add "$f" 2>/dev/null || true; done
          git diff --staged --quiet || git commit -m "chore: 댓글 응답 이력 $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
