name: 아침 증시 브리핑 (무지개로그 포맷 실험)

on:
  # 평일 장 전 KST 06:20 (UTC 21:20 일~목)
  schedule:
    - cron: "20 21 * * 0-4"
  workflow_dispatch:
    inputs:
      draft:
        description: "임시저장 검증 모드 (true/false)"
        required: false
        default: "false"

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true') && format('morning-brief-draft-{0}', github.run_id) || 'morning-brief' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # 2026-07-30 실사고: 네이버 에디터 무응답으로 4~5시간 행 → 기본 360분 소진 후 취소.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum && sudo fc-cache -f

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install chromium --with-deps

      - name: 브리핑 발행
        env:
          NAVER_ID:       ${{ secrets.NAVER_ID }}
          NAVER_PW:       ${{ secrets.NAVER_PW }}
          NAVER_BLOG_ID:  ${{ secrets.NAVER_BLOG_ID }}
          NAVER_COOKIES:  ${{ secrets.NAVER_COOKIES }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRAFT:          ${{ github.event.inputs.draft || 'false' }}
        run: python -m scripts.morning_brief_post

      - name: 스크린샷 아티팩트 업로드 (디버그)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-${{ github.run_id }}
          path: data/screenshots/
          if-no-files-found: ignore
          retention-days: 3

      - name: 발행 이력 커밋
        if: github.event.inputs.draft != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          HIST_FILES="data/morning_brief_history.json data/qc_log.jsonl data/qc_fail.jsonl"
          for f in $HIST_FILES; do git add "$f" 2>/dev/null || true; done
          # ★오탐 보정(2026-07-31): 종전엔 '스테이징 0건'이면 무조건 경고해서 발행할 게
          # 없어 정상 스킵한 런에서도 매번 울렸다. 진짜 사고는 '이력 파일이 수정됐는데
          # 스테이징이 안 된 것'이다. 스크린샷·쿠키 등 다른 변경까지 세지 않도록
          # 위 이력 파일로만 범위를 좁힌다.
          UNSTAGED=$(git diff --name-only -- $HIST_FILES 2>/dev/null || true)
          if [ -n "$UNSTAGED" ]; then
            echo "::warning::이력 파일이 수정됐는데 스테이징되지 않음 — 이력 유실 가능: $UNSTAGED"
          fi
          git diff --staged --quiet || git commit -m "chore: 아침 브리핑 이력 $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
