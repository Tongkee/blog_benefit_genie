name: 형수테크 심층 가이드 (PC 유입 특화)

on:
  # 2026-07-29 재개: 전면 수리(0468ba6) 후 DRAFT 30455935734 실측 통과 + 어드바이저 방향
  # (증상·문제해결 가이드 = 형수 롱테일 핵심) 반영. (2026-07-28 정지 사유: 구조 결함 5종)
  schedule:
    - cron: "11 20 * * *"   # KST 05:11 (지연 시 08~09시 도착)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "원고만 생성 (true/false)"
        required: false
        default: "false"
      draft:
        description: "임시저장 검증 (true/false)"
        required: false
        default: "false"
      topic_id:
        description: "주제 강제 지정 (tech_guide_pool.json의 id)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # 같은 hyungsutech 계정 — 뉴스 트랙(naver-tech-post)과 동시 로그인 방지 위해 그룹 공유
  # 2026-07-31: 뉴스 트랙과 group을 공유하면 한쪽이 멈출 때 다른 트랙까지 막힌다(실사고).
  # 같은 블로그라 동시 발행은 피해야 하므로 완전 분리 대신 전용 group + 순차 대기로 둔다.
  group: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') && format('naver-tech-guide-dry-{0}', github.run_id) || 'naver-tech-guide' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          pip install -q -r requirements.txt
          python -m playwright install chromium --with-deps > /dev/null

      - name: 폰트 설치 (헤더카드 한글)
        run: sudo apt-get install -y -qq fonts-nanum > /dev/null

      - name: 가이드 발행
        env:
          TECH_NAVER_ID:      ${{ secrets.TECH_NAVER_ID }}
          TECH_NAVER_PW:      ${{ secrets.TECH_NAVER_PW }}
          TECH_NAVER_BLOG_ID: ${{ secrets.TECH_NAVER_BLOG_ID }}
          TECH_NAVER_COOKIES: ${{ secrets.TECH_NAVER_COOKIES }}
          GOOGLE_API_KEY:     ${{ secrets.GOOGLE_API_KEY }}
          DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}
          DRAFT:              ${{ github.event.inputs.draft || 'false' }}
          FORCE_TOPIC_ID:     ${{ github.event.inputs.topic_id || '' }}
        run: python -m scripts.tech_guide_post

      - name: 이력 커밋
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ★개별 add: 한 경로라도 없으면 git add 전체가 실패해 스테이징 0건이 되던
          # 회귀 수정(2026-07-29). qc_fail.jsonl은 FAIL 없으면 파일 자체가 없음.
          HIST_FILES="data/tech_guide_history.json data/qc_log.jsonl data/qc_fail.jsonl"
          for f in $HIST_FILES; do git add "$f" 2>/dev/null || true; done
          # ★이력 미커밋 감시(2026-07-29): 발행 성공했는데 이력이 안 잡히면 경고를 남긴다.
          # (git add 회귀로 3일간 조용히 유실된 사고 재발 방지 — 카테고리 로테이션까지 망가짐)
          # ★오탐 보정(2026-07-31): 종전엔 '스테이징 0건'이면 무조건 경고해서 발행할 게
          # 없어 정상 스킵한 런에서도 매번 울렸다. 진짜 사고는 '이력 파일이 수정됐는데
          # 스테이징이 안 된 것'이다. 스크린샷·쿠키 등 다른 변경까지 세지 않도록
          # 위 이력 파일로만 범위를 좁힌다.
          UNSTAGED=$(git diff --name-only -- $HIST_FILES 2>/dev/null || true)
          if [ -n "$UNSTAGED" ]; then
            echo "::warning::이력 파일이 수정됐는데 스테이징되지 않음 — 이력 유실 가능: $UNSTAGED"
          fi
          git diff --staged --quiet || git commit -m "chore: 심층 가이드 이력 $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash -q origin main || { git rebase --abort 2>/dev/null; git pull --no-rebase -q origin main; }
          git push -q || (git pull --rebase --autostash -q origin main && git push -q)
