name: 고CPC 정보성 포스팅 (금융·세금·보험·부동산)

on:
  # 리런치(2026-06-30): 카테고리별 매일 1개 = 정보 4카테고리 하루 4회(자동순환=가장 오래된것 선택 → 4개 모두 매일 1개).
  schedule:
    # 정각(:00)은 GH Actions 큐 혼잡으로 스킵·지연 빈번 → :05 분산 + 스케줄 재등록
    - cron: "5 4 * * *"   # KST 13:05
    - cron: "5 6 * * *"   # KST 15:05
    - cron: "5 8 * * *"   # KST 17:05
    - cron: "5 10 * * *"  # KST 19:05
  workflow_dispatch:
    inputs:
      category:
        description: "카테고리"
        required: true
        type: choice
        options:
          - 금융재테크
          - 세금절세
          - 보험
          - 부동산주거
        default: 금융재테크
      force_post:
        description: "강제 실행 (true/false)"
        required: false
        default: "false"
      draft:
        description: "임시저장 검증 모드 (true/false)"
        required: false
        default: "false"
      keyword:
        description: "키워드 강제 지정 (비우면 자동 — 오류 글 재발행용, 중복회피 우회)"
        required: false
        default: ""
      facts:
        description: "검증된 공식 수치 주입 (재발행용 — 이 값만 문자 그대로 사용, 창작 차단)"
        required: false
        default: ""

concurrency:
  # DRAFT 검증 런은 run_id로 독립 그룹 → 스케줄 실발행 큐를 막지 않음.
  # 스케줄·실발행(비draft) dispatch는 공용 그룹 유지(중복발행 방지 직렬화).
  group: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true') && format('naver-info-draft-{0}', github.run_id) || 'naver-info-post' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # 2026-07-30 실사고: 네이버 에디터 무응답으로 4~5시간 행 → 기본 360분 소진 후 취소.
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum && sudo fc-cache -f

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치
        run: playwright install chromium --with-deps

      - name: 랜덤 딜레이 (봇 패턴 방지)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 900))
          echo "랜덤 딜레이: ${DELAY}초 (최대 15분)"
          sleep $DELAY

      - name: 실행 슬롯 설정 (중복 방지용)
        run: |
          # GH 스케줄러 지연 시 HOUR 드리프트 → cron 문자열로 슬롯 확정 (stock_post 패턴)
          case "${{ github.event.schedule }}" in
            "5 4 * * *"|"0 4 * * *")  SLOT="13" ;;
            "5 6 * * *"|"0 6 * * *")  SLOT="15" ;;
            "5 8 * * *"|"0 8 * * *")  SLOT="17" ;;
            "5 10 * * *"|"0 10 * * *") SLOT="19" ;;
            *) SLOT=$(TZ='Asia/Seoul' date '+%H') ;;
          esac
          echo "RUN_SLOT=$SLOT" >> $GITHUB_ENV
          echo "슬롯 확정: $SLOT (schedule='${{ github.event.schedule }}')"

      - name: 포스팅 실행
        env:
          NAVER_ID:       ${{ secrets.NAVER_ID }}
          NAVER_PW:       ${{ secrets.NAVER_PW }}
          NAVER_BLOG_ID:  ${{ secrets.NAVER_BLOG_ID }}
          NAVER_COOKIES:  ${{ secrets.NAVER_COOKIES }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          FSS_API_KEY:         ${{ secrets.FSS_API_KEY }}
          INFO_CATEGORY:  ${{ github.event.inputs.category }}
          FORCE_POST:     ${{ github.event.inputs.force_post || 'false' }}
          DRAFT:          ${{ github.event.inputs.draft || 'false' }}
          FORCE_KEYWORD:  ${{ github.event.inputs.keyword || '' }}
          FORCE_FACTS:    ${{ github.event.inputs.facts || '' }}
          RUN_SLOT:       ${{ env.RUN_SLOT }}
        run: python -m scripts.info_post

      - name: 스크린샷 아티팩트 업로드 (디버그)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: info-screenshots-${{ github.run_id }}
          path: data/screenshots/
          if-no-files-found: ignore
          retention-days: 3

      - name: 포스팅 이력 커밋
        if: github.event.inputs.draft != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ★개별 add: 한 경로라도 없으면 git add 전체가 실패해 스테이징 0건이 되던
          # 회귀 수정(2026-07-29). qc_fail.jsonl은 FAIL 없으면 파일 자체가 없음.
          HIST_FILES="data/info_*_history.json data/qc_log.jsonl data/qc_fail.jsonl"
          for f in $HIST_FILES; do git add "$f" 2>/dev/null || true; done
          # ★이력 미커밋 감시(2026-07-29): 발행 성공했는데 이력이 안 잡히면 경고를 남긴다.
          # (git add 회귀로 3일간 조용히 유실된 사고 재발 방지 — 카테고리 로테이션까지 망가짐)
          # ★오탐 보정(2026-07-31): 종전엔 '스테이징 0건'이면 무조건 경고해서 발행할 게
          # 없어 정상 스킵한 런에서도 매번 울렸다. 진짜 사고는 '이력 파일이 수정됐는데
          # 스테이징이 안 된 것'이다. 스크린샷·쿠키 등 다른 변경까지 세지 않도록
          # 위 이력 파일로만 범위를 좁힌다.
          UNSTAGED=$(git diff --name-only -- $HIST_FILES 2>/dev/null || true)
          if [ -n "$UNSTAGED" ]; then
            echo "::warning::이력 파일이 수정됐는데 스테이징되지 않음 — 이력 유실 가능: $UNSTAGED"
          fi
          git diff --staged --quiet || git commit -m "chore: 정보성 포스팅 이력 $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
